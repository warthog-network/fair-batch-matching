<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width" />
        <title>FBM Demo</title>
        <style>
            .invalid { border-color: red; background: #fff5f5; }
            .error-note { color: red; font-size: 0.85em; margin: 0 0 0.5em 0; min-height: 1em; }
            .match-ready { color: #080; font-weight: bold; }
            .match-not-ready { color: #888; }
            table { border-collapse: collapse; margin-bottom: 1em; }
            th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: right; }
            th:first-child, td:first-child { text-align: left; }
            input[type="text"], input[type="number"] { padding: 4px; min-width: 6em; }
            section { margin-bottom: 1.5em; }
            h2 { margin-bottom: 0.5em; }
            #matchOutput { background: #f4f4f4; padding: 0.5em; font-family: monospace; font-size: 0.85em; max-height: 20em; overflow: auto; }
        </style>
    </head>
    <body>
        <h1>Fair Batch Matching (FBM) Demo</h1>

        <section>
            <h2>Pool Reserves</h2>
            <label>Base (TOKEN): <input id="poolBase" type="text" placeholder="e.g. 100"></label>
            <p class="error-note" id="poolBaseError"></p>
            <label>Quote (WART): <input id="poolQuote" type="text" placeholder="e.g. 200"></label>
            <p class="error-note" id="poolQuoteError"></p>
        </section>

        <section>
            <h2>Settings</h2>
            <label>Fee (E4, 0–9999): <input id="feeE4" type="number" value="5" min="0" max="9999"></label>
            <p class="error-note" id="feeE4Error"></p>
        </section>

        <section>
            <h2>Add Buy (spend WART to buy TOKEN)</h2>
            <label>Limit: <input id="buyLimit" type="text" value="1.0"></label>
            <p class="error-note" id="buyLimitError"></p>
            <label>Amount (WART): <input id="buyAmount" type="text"></label>
            <p class="error-note" id="buyAmountError"></p>
            <button id="addBuyButton" disabled>Add buy</button>
            <p class="error-note" id="buyError"></p>
        </section>

        <section>
            <h2>Add Sell (sell TOKEN for WART)</h2>
            <label>Limit: <input id="sellLimit" type="text" value="1.0"></label>
            <p class="error-note" id="sellLimitError"></p>
            <label>Amount (TOKEN): <input id="sellAmount" type="text"></label>
            <p class="error-note" id="sellAmountError"></p>
            <button id="addSellButton" disabled>Add sell</button>
            <p class="error-note" id="sellError"></p>
        </section>

        <section>
            <h2>Order Book</h2>
            <h3>Sells</h3>
            <table>
                <thead><tr><th>×</th><th>AMOUNT</th><th>FILLED</th><th>LIMIT</th></tr></thead>
                <tbody id="tbodySell"></tbody>
            </table>
            <h3>Buys</h3>
            <table>
                <thead><tr><th>×</th><th>AMOUNT</th><th>FILLED</th><th>LIMIT</th></tr></thead>
                <tbody id="tbodyBuy"></tbody>
            </table>
        </section>

        <section>
            <h2>Match</h2>
            <p id="matchReadiness" class="match-not-ready">Waiting for valid pool reserves…</p>
            <div id="matchOutput"></div>
        </section>

        <script type="importmap">
        {
            "imports": {
                "warthog-fbm": "../pkg/dist/index.js"
            }
        }
        </script>
        <script type="module">
            import FbmEngine from "warthog-fbm";

            // ─── Init ────────────────────────────────────────────────────────
            // `warthog-fbm` is the npm package wrapping the wasm engine.
            // The import map above points it at the locally-built package
            // (`../pkg/dist/index.js`), so the demo uses the same code path
            // as real consumers — no raw Embind loader is needed.
            let engine = null;
            try {
                await FbmEngine.init();
                engine = new FbmEngine({ baseDecimals: 8, feeE4: 5 });
            } catch (err) {
                document.body.innerHTML = `<pre>Failed to load FBM engine: ${err.message}</pre>`;
                throw err;
            }

            // ─── JS-side state model ─────────────────────────────────────────
            // The engine is permissive — it always accepts values and always
            // returns a match. The demo owns field validity on the JS side
            // and gates `engine.match()` on it.
            const state = {
                poolBase:        { valid: false, error: "" },
                poolQuote:       { valid: false, error: "" },
                feeE4:           { valid: true,  error: "" },
                buyLimit:        { valid: false, error: "" },
                buyAmount:       { valid: false, error: "" },
                sellLimit:       { valid: false, error: "" },
                sellAmount:      { valid: false, error: "" },
                lastMatch: null,
            };

            // ─── DOM refs ─────────────────────────────────────────────────────
            const $ = (id) => document.getElementById(id);
            const poolBaseEl      = $("poolBase");
            const poolQuoteEl     = $("poolQuote");
            const poolBaseError   = $("poolBaseError");
            const poolQuoteError  = $("poolQuoteError");
            const feeE4El         = $("feeE4");
            const feeE4Error      = $("feeE4Error");
            const buyLimitEl      = $("buyLimit");
            const buyAmountEl     = $("buyAmount");
            const buyLimitError   = $("buyLimitError");
            const buyAmountError  = $("buyAmountError");
            const buyError        = $("buyError");
            const sellLimitEl     = $("sellLimit");
            const sellAmountEl    = $("sellAmount");
            const sellLimitError  = $("sellLimitError");
            const sellAmountError = $("sellAmountError");
            const sellError       = $("sellError");
            const tbodySell       = $("tbodySell");
            const tbodyBuy        = $("tbodyBuy");
            const matchReadiness  = $("matchReadiness");
            const matchOutput     = $("matchOutput");
            const addBuyButton    = $("addBuyButton");
            const addSellButton   = $("addSellButton");

            // ─── Renderers ────────────────────────────────────────────────────
            function renderField(input, errEl, f) {
                input.classList.toggle("invalid", !f.valid);
                input.title = f.error || "";
                errEl.textContent = f.error || "";
            }

            function renderOrders() {
                tbodyBuy.innerHTML = "";
                tbodySell.innerHTML = "";
                // Empty pool is valid — show rows regardless. Each row
                // reflects what the engine actually has, including FILLED
                // values from the latest match.
                if (!state.lastMatch) return;
                state.lastMatch.buys.forEach((row, i) => {
                    const tr = document.createElement("tr");
                    const btn = document.createElement("button");
                    btn.textContent = "×";
                    btn.dataset.buyIndex = String(i);
                    tr.insertCell().appendChild(btn);
                    tr.insertCell().textContent = row.amount;
                    tr.insertCell().textContent = row.filled;
                    tr.insertCell().textContent = String(row.limit);
                    tbodyBuy.appendChild(tr);
                });
                state.lastMatch.sells.forEach((row, i) => {
                    const tr = document.createElement("tr");
                    const btn = document.createElement("button");
                    btn.textContent = "×";
                    btn.dataset.sellIndex = String(i);
                    tr.insertCell().appendChild(btn);
                    tr.insertCell().textContent = row.amount;
                    tr.insertCell().textContent = row.filled;
                    tr.insertCell().textContent = String(row.limit);
                    tbodySell.appendChild(tr);
                });
            }

            function renderMatchReadiness() {
                const ready = state.poolBase.valid && state.poolQuote.valid;
                matchReadiness.className = ready ? "match-ready" : "match-not-ready";
                matchReadiness.textContent = ready
                    ? "Live match (re-runs on every change)"
                    : "Waiting for valid pool reserves…";
            }

            function renderMatch() {
                matchOutput.textContent = state.lastMatch
                    ? JSON.stringify(state.lastMatch, null, 2)
                    : "";
            }

            // ─── Single source of match() calls ─────────────────────────────
            // `tryMatch()` is the *only* place that calls `engine.match()`.
            // It early-returns (clearing lastMatch) if the pool is invalid.
            function tryMatch() {
                if (state.poolBase.valid && state.poolQuote.valid) {
                    state.lastMatch = engine.match();
                } else {
                    state.lastMatch = null;
                }
                renderMatchReadiness();
                renderMatch();
                renderOrders();
            }

            // ─── Button gating ────────────────────────────────────────────────
            function updateBuyButton() {
                const ready = state.poolBase.valid && state.poolQuote.valid
                    && state.buyLimit.valid && state.buyAmount.valid;
                addBuyButton.disabled = !ready;
            }
            function updateSellButton() {
                const ready = state.poolBase.valid && state.poolQuote.valid
                    && state.sellLimit.valid && state.sellAmount.valid;
                addSellButton.disabled = !ready;
            }

            // ─── Input handlers ───────────────────────────────────────────────
            poolBaseEl.addEventListener("input", () => {
                const res = engine.setPool({ base: poolBaseEl.value });
                state.poolBase.valid = "ok" in res;
                state.poolBase.error = "error" in res ? res.error : "";
                renderField(poolBaseEl, poolBaseError, state.poolBase);
                tryMatch();
                updateBuyButton();
                updateSellButton();
            });
            poolQuoteEl.addEventListener("input", () => {
                const res = engine.setPool({ quote: poolQuoteEl.value });
                state.poolQuote.valid = "ok" in res;
                state.poolQuote.error = "error" in res ? res.error : "";
                renderField(poolQuoteEl, poolQuoteError, state.poolQuote);
                tryMatch();
                updateBuyButton();
                updateSellButton();
            });
            feeE4El.addEventListener("input", () => {
                const n = Number(feeE4El.value);
                if (!Number.isFinite(n) || !Number.isInteger(n)) {
                    state.feeE4.valid = false;
                    state.feeE4.error = "must be an integer";
                } else {
                    const res = engine.setFeeE4(n);
                    state.feeE4.valid = "ok" in res;
                    state.feeE4.error = "error" in res ? res.error : "";
                }
                renderField(feeE4El, feeE4Error, state.feeE4);
                tryMatch();
            });

            buyLimitEl.addEventListener("input", () => {
                const res = engine.validateLimit(buyLimitEl.value);
                state.buyLimit.valid = "ok" in res;
                state.buyLimit.error = "error" in res ? res.error : "";
                renderField(buyLimitEl, buyLimitError, state.buyLimit);
                updateBuyButton();
            });
            buyAmountEl.addEventListener("input", () => {
                const res = engine.validateBaseAmount(buyAmountEl.value);
                state.buyAmount.valid = "ok" in res;
                state.buyAmount.error = "error" in res ? res.error : "";
                renderField(buyAmountEl, buyAmountError, state.buyAmount);
                updateBuyButton();
            });
            sellLimitEl.addEventListener("input", () => {
                const res = engine.validateLimit(sellLimitEl.value);
                state.sellLimit.valid = "ok" in res;
                state.sellLimit.error = "error" in res ? res.error : "";
                renderField(sellLimitEl, sellLimitError, state.sellLimit);
                updateSellButton();
            });
            sellAmountEl.addEventListener("input", () => {
                const res = engine.validateQuoteAmount(sellAmountEl.value);
                state.sellAmount.valid = "ok" in res;
                state.sellAmount.error = "error" in res ? res.error : "";
                renderField(sellAmountEl, sellAmountError, state.sellAmount);
                updateSellButton();
            });

            addBuyButton.addEventListener("click", () => {
                const res = engine.addBuy({
                    limit: buyLimitEl.value,
                    amount: buyAmountEl.value,
                });
                if ("ok" in res) {
                    buyLimitEl.value = "";
                    buyAmountEl.value = "";
                    state.buyLimit = { valid: false, error: "" };
                    state.buyAmount = { valid: false, error: "" };
                    renderField(buyLimitEl, buyLimitError, state.buyLimit);
                    renderField(buyAmountEl, buyAmountError, state.buyAmount);
                    buyError.textContent = "";
                    updateBuyButton();
                    tryMatch();
                } else {
                    buyError.textContent = res.error;
                }
            });
            addSellButton.addEventListener("click", () => {
                const res = engine.addSell({
                    limit: sellLimitEl.value,
                    amount: sellAmountEl.value,
                });
                if ("ok" in res) {
                    sellLimitEl.value = "";
                    sellAmountEl.value = "";
                    state.sellLimit = { valid: false, error: "" };
                    state.sellAmount = { valid: false, error: "" };
                    renderField(sellLimitEl, sellLimitError, state.sellLimit);
                    renderField(sellAmountEl, sellAmountError, state.sellAmount);
                    sellError.textContent = "";
                    updateSellButton();
                    tryMatch();
                } else {
                    sellError.textContent = res.error;
                }
            });

            // Delete order — buy orders are on the quote side, sell orders on
            // the base side. The index is into the engine's book (DESC for
            // buys, ASC for sells), so we use the dataset value directly.
            tbodyBuy.addEventListener("click", (e) => {
                const btn = e.target.closest("button[data-buy-index]");
                if (!btn) return;
                const idx = Number(btn.dataset.buyIndex);
                const res = engine.deleteBuyAt(idx);
                if (res) {
                    tryMatch();
                }
            });
            tbodySell.addEventListener("click", (e) => {
                const btn = e.target.closest("button[data-sell-index]");
                if (!btn) return;
                const idx = Number(btn.dataset.sellIndex);
                const res = engine.deleteSellAt(idx);
                if (res) {
                    tryMatch();
                }
            });

            // ─── Initial render ───────────────────────────────────────────────
            renderMatchReadiness();
            renderMatch();
        </script>
    </body>
</html>
