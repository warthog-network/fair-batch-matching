<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width" />
        <title>FBM Demo</title>
        <style>
            .invalid { border-color: red; background: #fff5f5; }
            .error-note { color: red; font-size: 0.85em; margin: 0 0 0.5em 0; min-height: 1em; }
            .match-ready { color: #080; font-weight: bold; }
            .match-not-ready { color: #888; }
            table { border-collapse: collapse; margin-bottom: 1em; }
            th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: right; }
            th:first-child, td:first-child { text-align: left; }
            input[type="text"], input[type="number"] { padding: 4px; min-width: 6em; }
            .hint { color: #666; font-size: 0.85em; margin: 0.2em 0 0.8em 0; }
            tr.level-row { font-weight: bold; }
            tr.order-row { color: #444; font-size: 0.9em; }
            tr.order-row td:first-child { padding-left: 2em; }
            tr.order-row button { font-weight: normal; }
            /* A caption belongs to an order, so the column only shows when
               the individual orders are shown. */
            .caption-only { display: none; }
            table.show-orders .caption-only { display: table-cell; }
            section { margin-bottom: 1.5em; }
            h2 { margin-bottom: 0.5em; }
            #matchOutput { background: #f4f4f4; padding: 0.5em; font-family: monospace; font-size: 0.85em; max-height: 20em; overflow: auto; }
        </style>
    </head>
    <body>
        <h1>Fair Batch Matching (FBM) Demo</h1>

        <section>
            <h2>Pool Reserves</h2>
            <label>Base (TOKEN): <input id="poolBase" type="text" placeholder="e.g. 100"></label>
            <p class="error-note" id="poolBaseError"></p>
            <label>Quote (WART): <input id="poolQuote" type="text" placeholder="e.g. 200"></label>
            <p class="error-note" id="poolQuoteError"></p>
        </section>

        <section>
            <h2>Settings</h2>
            <label>Fee (E4, 0–9999): <input id="feeE4" type="number" min="0" max="9999" required></label>
            <p class="error-note" id="feeE4Error"></p>
        </section>

        <section>
            <h2>Add Buy (spend WART to buy TOKEN)</h2>
            <label>Limit: <input id="buyLimit" type="text"></label>
            <p class="error-note" id="buyLimitError"></p>
            <label>Amount (WART): <input id="buyAmount" type="text"></label>
            <p class="error-note" id="buyAmountError"></p>
            <label>Caption (optional): <input id="buyCaption" type="text" maxlength="256"></label>
            <p class="error-note" id="buyCaptionError"></p>
            <button id="addBuyButton" disabled>Add buy</button>
            <p class="error-note" id="buyError"></p>
        </section>

        <section>
            <h2>Add Sell (sell TOKEN for WART)</h2>
            <label>Limit: <input id="sellLimit" type="text"></label>
            <p class="error-note" id="sellLimitError"></p>
            <label>Amount (TOKEN): <input id="sellAmount" type="text"></label>
            <p class="error-note" id="sellAmountError"></p>
            <label>Caption (optional): <input id="sellCaption" type="text" maxlength="256"></label>
            <p class="error-note" id="sellCaptionError"></p>
            <button id="addSellButton" disabled>Add sell</button>
            <p class="error-note" id="sellError"></p>
        </section>

        <section>
            <h2>Order Book</h2>
            <label><input id="showOrders" type="checkbox"> Show individual orders</label>
            <p class="hint" id="showOrdersHint"></p>
            <h3>Sells</h3>
            <table id="tableSell">
                <thead><tr><th>×</th><th class="caption-only">CAPTION</th><th>AMOUNT</th><th>FILLED</th><th>PROCEEDS</th><th>LIMIT</th></tr></thead>
                <tbody id="tbodySell"></tbody>
            </table>
            <h3>Buys</h3>
            <table id="tableBuy">
                <thead><tr><th>×</th><th class="caption-only">CAPTION</th><th>AMOUNT</th><th>FILLED</th><th>PROCEEDS</th><th>LIMIT</th></tr></thead>
                <tbody id="tbodyBuy"></tbody>
            </table>
        </section>

        <section>
            <h2>Pool</h2>
            <table>
                <thead><tr><th></th><th>BASE</th><th>QUOTE</th></tr></thead>
                <tbody id="tbodyPool"></tbody>
            </table>
        </section>

        <section>
            <h2>Match</h2>
            <p id="matchReadiness" class="match-not-ready">Waiting for valid pool reserves…</p>
            <div id="matchOutput"></div>
        </section>

        <script type="importmap">
        {
            "imports": {
                "warthog-fbm": "./warthog-fbm/index.js"
            }
        }
        </script>
        <script type="module">
            import FbmEngine from "warthog-fbm";

            // ─── Init ────────────────────────────────────────────────────────
            // `warthog-fbm` is the npm package wrapping the wasm engine.
            // The import map above points it at the locally-built package
            // (`../pkg/dist/index.js`), so the demo uses the same code path
            // as real consumers — no raw Embind loader is needed.
            let engine = null;
            try {
                await FbmEngine.init();
                engine = new FbmEngine({ baseDecimals: 8, feeE4: 50 });
            } catch (err) {
                document.body.innerHTML = `<pre>Failed to load FBM engine: ${err.message}</pre>`;
                throw err;
            }

            // ─── JS-side state model ─────────────────────────────────────────
            // The engine is permissive — it always accepts values and always
            // returns a match. The demo owns field validity on the JS side
            // and gates `engine.match()` on it.
            const state = {
                poolBase:        { valid: false, error: "" },
                poolQuote:       { valid: false, error: "" },
                feeE4:           { valid: true,  error: "" },
                buyLimit:        { valid: false, error: "" },
                buyAmount:       { valid: false, error: "" },
                buyCaption:      { valid: true,  error: "" },
                sellLimit:       { valid: false, error: "" },
                sellAmount:      { valid: false, error: "" },
                sellCaption:     { valid: true,  error: "" },
                // Show the individual orders of every price level, not just
                // the levels themselves.
                showOrders: false,
                lastMatch: null,
            };

            // ─── DOM refs ─────────────────────────────────────────────────────
            const $ = (id) => document.getElementById(id);
            const poolBaseEl      = $("poolBase");
            const poolQuoteEl     = $("poolQuote");
            const poolBaseError   = $("poolBaseError");
            const poolQuoteError  = $("poolQuoteError");
            const feeE4El         = $("feeE4");
            const feeE4Error      = $("feeE4Error");
            feeE4El.value = String(engine.getConfig().feeE4);
            const buyLimitEl      = $("buyLimit");
            const buyAmountEl     = $("buyAmount");
            const buyLimitError   = $("buyLimitError");
            const buyAmountError  = $("buyAmountError");
            const buyError        = $("buyError");
            const sellLimitEl     = $("sellLimit");
            const sellAmountEl    = $("sellAmount");
            const sellLimitError  = $("sellLimitError");
            const sellAmountError = $("sellAmountError");
            const sellError       = $("sellError");
            const tbodySell       = $("tbodySell");
            const tbodyBuy        = $("tbodyBuy");
            const tbodyPool       = $("tbodyPool");
            const tableSell       = $("tableSell");
            const tableBuy        = $("tableBuy");
            const showOrdersEl    = $("showOrders");
            const showOrdersHint  = $("showOrdersHint");
            const buyCaptionEl    = $("buyCaption");
            const buyCaptionError = $("buyCaptionError");
            const sellCaptionEl   = $("sellCaption");
            const sellCaptionError = $("sellCaptionError");
            const matchReadiness  = $("matchReadiness");
            const matchOutput     = $("matchOutput");
            const addBuyButton    = $("addBuyButton");
            const addSellButton   = $("addSellButton");

            // ─── Renderers ────────────────────────────────────────────────────
            function renderField(input, errEl, f) {
                input.classList.toggle("invalid", !f.valid);
                input.title = f.error || "";
                errEl.textContent = f.error || "";
            }

            function renderOrders() {
                tbodyBuy.innerHTML = "";
                tbodySell.innerHTML = "";
                // Empty pool is valid — show rows regardless. Each row
                // reflects what the engine actually has, including FILLED
                // values from the latest match.
                if (!state.lastMatch) return;

                // The book comes as price levels, each holding its
                // individual orders. A level row shows the totals, and the
                // order rows below it show the individual orders.
                //
                // A caption belongs to an order, so the caption column is
                // only shown when the individual orders are.
                tableBuy.classList.toggle("show-orders", state.showOrders);
                tableSell.classList.toggle("show-orders", state.showOrders);

                const renderSide = (tbody, levels) => {
                    // The flat index of an order in the engine's book: the
                    // orders of the preceding levels plus its position
                    // within its level. That is the index deleteBuyAt and
                    // deleteSellAt take.
                    let flatIndex = 0;
                    levels.forEach((level, levelIndex) => {
                        const tr = document.createElement("tr");
                        tr.className = "level-row";
                        const btn = document.createElement("button");
                        btn.textContent = "×";
                        btn.dataset.levelIndex = String(levelIndex);
                        tr.insertCell().appendChild(btn);
                        // A caption belongs to an order, so a level row has
                        // no caption of its own.
                        const captionCell = tr.insertCell();
                        captionCell.className = "caption-only";
                        tr.insertCell().textContent = level.amount;
                        tr.insertCell().textContent = level.filled;
                        tr.insertCell().textContent = level.proceeds;
                        tr.insertCell().textContent = String(level.limit);
                        tbody.appendChild(tr);

                        if (!state.showOrders) {
                            flatIndex += level.orders.length;
                            return;
                        }
                        level.orders.forEach((order) => {
                            const otr = document.createElement("tr");
                            otr.className = "order-row";
                            const obtn = document.createElement("button");
                            obtn.textContent = "×";
                            obtn.dataset.orderIndex = String(flatIndex);
                            otr.insertCell().appendChild(obtn);
                            const oc = otr.insertCell();
                            oc.className = "caption-only";
                            oc.textContent = order.caption;
                            otr.insertCell().textContent = order.amount;
                            otr.insertCell().textContent = order.filled;
                            otr.insertCell().textContent = order.proceeds;
                            // The price is not repeated per order, the level
                            // carries it.
                            otr.insertCell().textContent = String(level.limit);
                            tbody.appendChild(otr);
                            flatIndex += 1;
                        });
                    });
                };

                renderSide(tbodyBuy, state.lastMatch.buys);
                renderSide(tbodySell, state.lastMatch.sells);
            }

            function renderPool() {
                tbodyPool.innerHTML = "";
                if (!state.lastMatch) return;
                const p = state.lastMatch.pool;
                const row = (label, base, quote) => {
                    const tr = document.createElement("tr");
                    tr.insertCell().textContent = label;
                    tr.insertCell().textContent = base;
                    tr.insertCell().textContent = quote;
                    tbodyPool.appendChild(tr);
                };
                row("Before", p.before.base, p.before.quote);
                if (p.swap) {
                    // The real part of the pool flow: what the match pushed
                    // into the reserves and what it took out of them.
                    row(p.swap.isQuote ? "Swap (quote in)" : "Swap (base in)",
                        p.swap.isQuote ? `-${p.swap.out}` : p.swap.in,
                        p.swap.isQuote ? p.swap.in : `-${p.swap.out}`);
                }
                // The rounding dust: what the floor division left over and
                // the node credits back to the reserves.
                row("Dust", p.dust.base, p.dust.quote);
                row("After", p.after.base, p.after.quote);
            }

            function renderMatchReadiness() {
                const ready = state.poolBase.valid && state.poolQuote.valid;
                matchReadiness.className = ready ? "match-ready" : "match-not-ready";
                matchReadiness.textContent = ready
                    ? "Live match (re-runs on every change)"
                    : "Waiting for valid pool reserves…";
            }

            function renderMatch() {
                matchOutput.textContent = state.lastMatch
                    ? JSON.stringify(state.lastMatch, null, 2)
                    : "";
            }

            // ─── Single source of match() calls ─────────────────────────────
            // `tryMatch()` is the *only* place that calls `engine.match()`.
            // `engine.match()` always returns a full result regardless of
            // pool state — the order book is always correct, the pool
            // parts are zero when the pool is empty.
            function tryMatch() {
                state.lastMatch = engine.match();
                renderMatchReadiness();
                renderMatch();
                renderOrders();
                renderPool();
            }

            // ─── Button gating ────────────────────────────────────────────────
            function updateBuyButton() {
                const ready = state.buyLimit.valid && state.buyAmount.valid;
                addBuyButton.disabled = !ready;
            }
            function updateSellButton() {
                const ready = state.sellLimit.valid && state.sellAmount.valid;
                addSellButton.disabled = !ready;
            }

            // ─── Input handlers ───────────────────────────────────────────────
            const showOrdersHintText = () => showOrdersHint.textContent = state.showOrders
                ? "Each price level is followed by its individual orders. × on a level removes every order at that price, × on an order removes that one."
                : "One row per price level, the units the FBM matches on. × removes every order at that level.";
            showOrdersEl.addEventListener("change", () => {
                state.showOrders = showOrdersEl.checked;
                showOrdersHintText();
                renderOrders();
            });
            showOrdersHintText();

            poolBaseEl.addEventListener("input", () => {
                const res = engine.setPool({ base: poolBaseEl.value });
                state.poolBase.valid = "ok" in res;
                state.poolBase.error = "error" in res ? res.error : "";
                renderField(poolBaseEl, poolBaseError, state.poolBase);
                tryMatch();
                updateBuyButton();
                updateSellButton();
            });
            poolQuoteEl.addEventListener("input", () => {
                const res = engine.setPool({ quote: poolQuoteEl.value });
                state.poolQuote.valid = "ok" in res;
                state.poolQuote.error = "error" in res ? res.error : "";
                renderField(poolQuoteEl, poolQuoteError, state.poolQuote);
                tryMatch();
                updateBuyButton();
                updateSellButton();
            });
            feeE4El.addEventListener("input", () => {
                // For <input type="number" required>, `validity.valid`
                // catches: empty input (valueMissing), letters
                // (badInput), out-of-range (rangeOverflow/Underflow),
                // and non-integer (stepMismatch). el.value can hide
                // invalid input from the .value property, so don't
                // rely on Number() alone.
                if (!feeE4El.validity.valid) {
                    state.feeE4.valid = false;
                    state.feeE4.error = feeE4El.validationMessage
                        || "must be a number 0-9999";
                    renderField(feeE4El, feeE4Error, state.feeE4);
                    tryMatch();
                    return;
                }
                const res = engine.setFeeE4(Number(feeE4El.value));
                state.feeE4.valid = "ok" in res;
                state.feeE4.error = "error" in res ? res.error : "";
                renderField(feeE4El, feeE4Error, state.feeE4);
                tryMatch();
            });

            buyLimitEl.addEventListener("input", () => {
                const res = engine.validateLimit(buyLimitEl.value);
                state.buyLimit.valid = "ok" in res;
                state.buyLimit.error = "error" in res ? res.error : "";
                renderField(buyLimitEl, buyLimitError, state.buyLimit);
                updateBuyButton();
            });
            buyAmountEl.addEventListener("input", () => {
                const res = engine.validateBaseAmount(buyAmountEl.value);
                state.buyAmount.valid = "ok" in res;
                state.buyAmount.error = "error" in res ? res.error : "";
                renderField(buyAmountEl, buyAmountError, state.buyAmount);
                updateBuyButton();
            });
            sellLimitEl.addEventListener("input", () => {
                const res = engine.validateLimit(sellLimitEl.value);
                state.sellLimit.valid = "ok" in res;
                state.sellLimit.error = "error" in res ? res.error : "";
                renderField(sellLimitEl, sellLimitError, state.sellLimit);
                updateSellButton();
            });
            sellAmountEl.addEventListener("input", () => {
                const res = engine.validateQuoteAmount(sellAmountEl.value);
                state.sellAmount.valid = "ok" in res;
                state.sellAmount.error = "error" in res ? res.error : "";
                renderField(sellAmountEl, sellAmountError, state.sellAmount);
                updateSellButton();
            });

            // Validate fields with default values so state reflects
            // reality on page load. (Without this, the limit field has
            // `value="1.0"` in HTML but state.buyLimit.valid stays
            // false until the user changes the value.)
            //
            // Arrow functions preserve the `engine` binding for the call.
            // (Embind-exposed methods are bound to the instance only
            // at the method-call site, not when stored in a variable.)
            for (const [el, key, validator] of [
                [buyLimitEl,   "buyLimit",   (v) => engine.validateLimit(v)],
                [buyAmountEl,  "buyAmount",  (v) => engine.validateBaseAmount(v)],
                [sellLimitEl,  "sellLimit",  (v) => engine.validateLimit(v)],
                [sellAmountEl, "sellAmount", (v) => engine.validateQuoteAmount(v)],
            ]) {
                if (el.value) {
                    const res = validator(el.value);
                    state[key].valid = "ok" in res;
                    state[key].error = "error" in res ? res.error : "";
                }
            }
            updateBuyButton();
            updateSellButton();

            addBuyButton.addEventListener("click", () => {
                const res = engine.addBuy({
                    limit: buyLimitEl.value,
                    amount: buyAmountEl.value,
                    ...(buyCaptionEl.value ? { caption: buyCaptionEl.value } : {}),
                });
                if ("ok" in res) {
                    buyError.textContent = "";
                    tryMatch();
                } else {
                    buyError.textContent = res.error;
                }
            });
            addSellButton.addEventListener("click", () => {
                const res = engine.addSell({
                    limit: sellLimitEl.value,
                    amount: sellAmountEl.value,
                    ...(sellCaptionEl.value ? { caption: sellCaptionEl.value } : {}),
                });
                if ("ok" in res) {
                    sellError.textContent = "";
                    tryMatch();
                } else {
                    sellError.textContent = res.error;
                }
            });

            // Delete: buy orders are on the quote side, sell orders on the
            // base side. A level row removes every order at that price, an
            // order row removes that single order.
            tbodyBuy.addEventListener("click", (e) => {
                const levelBtn = e.target.closest("button[data-level-index]");
                if (levelBtn) {
                    // A level row: remove every order at that price.
                    const level = state.lastMatch.buys[Number(levelBtn.dataset.levelIndex)];
                    if (!level) return;
                    engine.deleteBuysAtPrice(level.limitBits);
                    tryMatch();
                    return;
                }
                const orderBtn = e.target.closest("button[data-order-index]");
                if (!orderBtn) return;
                // An order row: remove that single order. The index is the
                // flat index into the engine's book.
                engine.deleteBuyAt(Number(orderBtn.dataset.orderIndex));
                tryMatch();
            });
            tbodySell.addEventListener("click", (e) => {
                const levelBtn = e.target.closest("button[data-level-index]");
                if (levelBtn) {
                    // A level row: remove every order at that price.
                    const level = state.lastMatch.sells[Number(levelBtn.dataset.levelIndex)];
                    if (!level) return;
                    engine.deleteSellsAtPrice(level.limitBits);
                    tryMatch();
                    return;
                }
                const orderBtn = e.target.closest("button[data-order-index]");
                if (!orderBtn) return;
                // An order row: remove that single order. The index is the
                // flat index into the engine's book.
                engine.deleteSellAt(Number(orderBtn.dataset.orderIndex));
                tryMatch();
            });

            // ─── Initial render ───────────────────────────────────────────────
            renderMatchReadiness();
            renderMatch();
        </script>
    </body>
</html>
