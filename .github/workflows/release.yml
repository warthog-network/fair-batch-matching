name: Release WASM + npm
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Leave blank for master-<short-sha>.'
        required: false
        type: string
      skip_publish:
        description: 'Skip the npm publish step (still builds everything).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build & publish WASM + npm release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install Meson
        run: python3 -m pip install --break-system-packages meson

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            NAME="${{ inputs.tag }}"
          else
            NAME="master-${GITHUB_SHA::7}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify lockstep versions
        run: |
          meson_v=$(grep -oP "^\s*version\s*:\s*'\K[^']+" cpp/meson.build)
          npm_v=$(node -p "require('./pkg/package.json').version")
          [ "$meson_v" = "$npm_v" ] || { echo "version drift: meson=$meson_v npm=$npm_v"; exit 1; }

      - name: Configure + build
        run: |
          meson setup cpp/build-wasm --cross-file=cpp/crosscompile/emscripten.txt --prefix=/
          meson compile -C cpp/build-wasm

      - name: Verify Embind symbols present
        run: |
          # FbmEngine class + 14 methods
          # (6 mutators, 3 validators, 4 getters, 1 match).
          for fn in FbmEngine \
                    setPool setFeeE4 \
                    addBuy addSell deleteBuyAt deleteSellAt \
                    validateLimit validateBaseAmount validateQuoteAmount \
                    getConfig getPool getBuyAt getSellAt \
                    match; do
            strings cpp/build-wasm/fbm.wasm | grep -qx "$fn" \
              || { echo "missing Embind binding: $fn"; exit 1; }
          done

      - name: Verify emcc --emit-tsd wrote index.raw.d.ts
        run: |
          [ -f pkg/index.raw.d.ts ] || { echo "missing pkg/index.raw.d.ts"; exit 1; }
          grep -q 'export default function MainModuleFactory' pkg/index.raw.d.ts \
            || { echo "pkg/index.raw.d.ts does not look like an emcc tsd output"; exit 1; }

      - name: Stage demo bundle into demo/out/
        run: just stage

      - name: Install TypeScript in pkg/
        working-directory: pkg
        run: npm install --no-audit --no-fund

      - name: Build the npm package (wasm + TS + assets)
        working-directory: pkg
        run: npm run build

      - name: Stage package files into out/ for the demo bundle
        run: |
          # Copy the runtime parts of pkg/dist/ into out/ for the demo zip.
          # .d.ts files stay in pkg/dist/ (they ship via the npm tarball instead,
          # which is what TypeScript consumers need).
          mkdir -p out/pkg/dist/src
          cp -f pkg/dist/index.js pkg/dist/fbm.js pkg/dist/fbm.wasm out/pkg/dist/
          cp -f pkg/dist/src/loader.js out/pkg/dist/src/

      - name: Run TS tests
        working-directory: pkg
        run: npm test

      - name: Pack npm tarball for GitHub Release
        working-directory: pkg
        run: npm pack

      - name: Publish to npm
        if: ${{ !inputs.skip_publish }}
        working-directory: pkg
        run: npm publish --access public --provenance

      - name: Zip demo bundle
        run: (cd demo/out && zip -r ../../fbm-demo.zip .)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            fbm-demo.zip
            pkg/warthog-fbm-*.tgz
          fail_on_unmatched_files: false