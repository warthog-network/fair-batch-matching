name: Release WASM + npm
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Leave blank for master-<short-sha>.'
        required: false
        type: string
      skip_publish:
        description: 'Skip the npm publish step (still builds everything).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build & publish WASM + npm release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install Meson
        run: python3 -m pip install --break-system-packages meson

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            NAME="${{ inputs.tag }}"
          else
            NAME="master-${GITHUB_SHA::7}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify lockstep versions
        run: |
          meson_v=$(grep -oP "^\s*version\s*:\s*'\K[^']+" meson.build)
          npm_v=$(node -p "require('./pkg/package.json').version")
          [ "$meson_v" = "$npm_v" ] || { echo "version drift: meson=$meson_v npm=$npm_v"; exit 1; }

      - name: Configure + build
        run: |
          meson setup build-wasm --cross-file=crosscompile/emscripten.txt --prefix=/
          meson compile -C build-wasm

      - name: Verify Embind symbols present
        run: |
          # FbmEngine class + 10 methods (7 mutators/match + 3 getters) and the
          # factory class binding.
          for fn in FbmEngine reset setPoolBase setPoolQuote setFee addBuy addSell deleteOrder getConfig getPoolBase getPoolQuote match; do
            strings build-wasm/fbm.wasm | grep -qx "$fn" \
              || { echo "missing Embind binding: $fn"; exit 1; }
          done

      - name: Verify emcc --emit-tsd wrote index.raw.d.ts
        run: |
          [ -f pkg/index.raw.d.ts ] || { echo "missing pkg/index.raw.d.ts"; exit 1; }
          grep -q 'export default function MainModuleFactory' pkg/index.raw.d.ts \
            || { echo "pkg/index.raw.d.ts does not look like an emcc tsd output"; exit 1; }

      - name: Stage demo bundle into out/
        run: DESTDIR="$(pwd)/out" meson install -C build-wasm

      - name: Install TypeScript in pkg/
        working-directory: pkg
        run: npm install --no-audit --no-fund

      - name: Build the npm package (wasm + TS + assets)
        working-directory: pkg
        run: npm run build

      - name: Run TS tests
        working-directory: pkg
        run: npm test

      - name: Verify npm package layout
        run: |
          for f in package.json index.js index.d.ts index.raw.d.ts src/loader.js fbm.js fbm.wasm; do
            [ -f "pkg/dist/$f" ] || { echo "missing pkg/dist/$f"; exit 1; }
          done

      - name: Pack npm tarball for GitHub Release
        working-directory: pkg
        run: npm pack

      - name: Publish to npm
        if: ${{ !inputs.skip_publish }}
        working-directory: pkg
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Zip demo bundle
        run: (cd out && zip -r ../fbm-demo.zip .)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            out/fbm.wasm
            out/fbm.js
            fbm-demo.zip
            pkg/warthog-fbm-*.tgz
          fail_on_unmatched_files: false